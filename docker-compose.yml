services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fontes
      POSTGRES_PASSWORD: fontes
      POSTGRES_DB: fontes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fontes"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: fontes
      RABBITMQ_DEFAULT_PASS: fontes
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
