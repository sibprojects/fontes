services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fontes
      POSTGRES_PASSWORD: fontes
      POSTGRES_DB: fontes
    # Host ports sit above 15000: Windows reserves random ranges below that (its dynamic
    # port range) after a reboot, which made 5432 and 5672 unbindable.
    ports:
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fontes"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    # A fixed node name plus a volume keep durable queues and messages across `down`/`up`.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fontes
      RABBITMQ_DEFAULT_PASS: fontes
    ports:
      - "25672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Local embeddings and chat. Models live in the `ollama` volume, so they are downloaded once.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: downloads the embedding model (bge-m3, about 1.2 GB) and the chat model
  # (CHAT_MODEL, qwen2.5:7b by default, about 4.7 GB) on the first start; later starts find
  # them in the volume and finish at once. The worker waits for it.
  ollama-pull:
    image: ollama/ollama
    entrypoint: ["sh", "-c"]
    command: ["ollama pull bge-m3 && ollama pull $${CHAT_MODEL}"]
    environment:
      OLLAMA_HOST: ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
    depends_on:
      ollama:
        condition: service_healthy

  # One-shot: applies database migrations, then exits. api and worker wait for it.
  # The only service with `build:`; api and worker reuse the image it builds.
  migrate:
    build: ./backend
    image: fontes-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fontes:fontes@postgres:5432/fontes
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: fontes-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fontes:fontes@postgres:5432/fontes
      RABBITMQ_URL: amqp://fontes:fontes@rabbitmq:5672/
      STORAGE_DIR: /data/uploads
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    # Not on ollama-pull: the API serves documents while the models download; asking before
    # they are there gives an error event that says which model to pull.
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Consumes fontes.ingest; on start it also requeues documents stuck in `queued`.
  worker:
    image: fontes-backend
    command: ["python", "-m", "fontes.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fontes:fontes@postgres:5432/fontes
      RABBITMQ_URL: amqp://fontes:fontes@rabbitmq:5672/
      STORAGE_DIR: /data/uploads
      OLLAMA_URL: http://ollama:11434
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  pgdata:
  rabbitmq:
  uploads:
  ollama:
