services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fontes
      POSTGRES_PASSWORD: fontes
      POSTGRES_DB: fontes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fontes"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: fontes
      RABBITMQ_DEFAULT_PASS: fontes
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: applies database migrations, then exits. api waits for it.
  migrate:
    build: ./backend
    image: fontes-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fontes:fontes@postgres:5432/fontes
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    image: fontes-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fontes:fontes@postgres:5432/fontes
      RABBITMQ_URL: amqp://fontes:fontes@rabbitmq:5672/
      STORAGE_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
