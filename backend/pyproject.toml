[project]
name = "fontes"
version = "0.1.0"
description = "RAG over your documents with cited sources"
requires-python = ">=3.12"
dependencies = [
    "aio-pika",
    "alembic>=1.20.1",
    "asyncpg",
    "beautifulsoup4>=4.15.0",
    "fastapi",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic-settings",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fontes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs running Postgres/RabbitMQ"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
