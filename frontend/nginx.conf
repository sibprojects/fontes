# Serves the built app and proxies /api/ to the api service, so the browser sees one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Above the API's 20 MiB upload limit, so a too-large file gets the API's JSON 413
    # instead of an nginx error page.
    client_max_body_size 25m;

    # Docker's DNS. With the address in a variable, nginx looks the api up again (every 10 s)
    # instead of once at start, so a recreated api container is found at its new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        # Strip the prefix, as the Vite dev proxy does: /api/documents -> /documents.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: pass tokens on as they arrive; allow a slow first answer while the model loads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # The app has no routes of its own, but an unknown path still gets the app, not a 404.
    location / {
        try_files $uri /index.html;
    }

    # index.html names the hashed assets of one build, so the browser must check it again
    # each time; a stale copy after a rebuild would load assets that are gone (a blank page).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
